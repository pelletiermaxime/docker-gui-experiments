[package]
name = "gpui-containers"
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace]

[dependencies]
anyhow = "1"
gpui-kit = { version = "=0.8.0", features = ["gpui-fast"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "process", "time", "io-util", "macros"] }

[profile.release]
lto = "thin"
strip = true
