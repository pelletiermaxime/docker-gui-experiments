[package]
name = "rune-live-containers"
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace]

[dependencies]
anyhow = "1"
# prepare.sh downloads the exact upstream revision into this ignored directory.
rune = { path = "../../../.verification/rune/source/crates/rune", default-features = false, features = ["accessibility"] }
rune-kit = { path = "../../../.verification/rune/source/crates/rune-kit" }
bollard = "=0.21.1"
tokio = { version = "1", features = ["rt", "time", "net"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
